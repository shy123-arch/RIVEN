# RIVEN paper main table (main_scratch) — verified against the 2026-11-13 run.
# Mirrors experiments/ablations/registry.py, the executable source of truth.
#
# Route: unseen-source split -> SFT (epoch2) -> caches -> per-seed VQ ->
# 200-epoch head -> VAL checkpoint selection -> TEST -> clean evaluator.

method: RIVEN
data:
  version: umrm_v2280_unseen_20261112     # 1854 / 213 / 213, source-disjoint
  split_sha256: 94fb31a2…54b21

condition:
  encoder: Qwen3-VL-4B-Instruct          # frozen base + LoRA
  sft:
    task: plan_exec
    epochs: 3
    lr: 1.0e-4
    accum: 8
    lora_r: 16
    init_adapter: s10k_pt/epoch1         # required for the paper numbers
    selected_epoch: 2                    # lowest VAL NLL per token
  role_adapter:
    type: role
    slots: 16
    visual_tokens: 16
    plan_slots: 4
    time_tokens: false
  layers: {riv: 36, aem_visual: 27, aem_plan: 18}
  riv_prefix: direct                     # c = r; AEM is KV memory only
  drop_mode: learned_null
  cond_drop: 0.1
  cfg_mem: true

tokenizer:
  type: rvq
  quantizers: 6
  init: HumanML3D RVQ, first quantizer layer only (no ViMo)
  steps: 3000
  window_max: 208

head:
  architecture: masked transformer + residual transformer
  init: scratch
  steps: 11500                           # 200 epochs
  batch: 32
  lr: 1.0e-4
  crop: full
  selection:
    candidates: [9000, 10500, last]
    rule: VAL R@10 within 0.5pp of best, then lowest VAL FID

generation:
  timesteps: 18
  cfg_mode: intent
  cond_scale: 1.0
  res_scale: 1.0
  topk: 0.95
  lengths: gt
  samples: 15

evaluation:
  evaluator: clean HML3D-init + EgoReReal TRAIN adapted   # NOT the legacy E2
  evaluator_seeds: [20261111, 20261112, 20261113]
  fid: 512-D motion embedding, per-sample, GT/min length aligned
  retrieval: t2m, source-excluded 32-pool, 20 draws, seed 0, R@1/2/3/10
  split: test (213), no TEST selection
